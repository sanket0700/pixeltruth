name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGION: us-central1
  SERVICE: pixeltruth
  REPOSITORY: pixeltruth

permissions:
  contents: read
  # Required for keyless auth to GCP via Workload Identity Federation - no
  # service-account JSON key is stored in this repo.
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Java is needed by the Firestore emulator npm test spins up via
      # `firebase emulators:exec`. ubuntu-latest usually ships one already,
      # but pin it explicitly rather than depend on runner-image defaults
      # that can change.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Emulator binaries would otherwise re-download on every run -
      # cache keyed on the firebase-tools version pinned in
      # package-lock.json, since that's what determines which emulator
      # binaries get requested.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      # npm test exercises CommunityForensicsDetector against real
      # fixtures, which needs the real ONNX model present - the model
      # bucket is private (see infra/models.tf), so this job needs its own
      # GCP auth even though it never touches Cloud Run/Artifact Registry.
      #
      # Skipped for Dependabot: GitHub doesn't pass repository secrets to
      # Dependabot-triggered runs at all (a platform security default, not
      # something fixable from this side) - confirmed by a real failed run
      # here, not assumed. The model-dependent tests themselves check for
      # the model file and skip (not fail) when it's absent, so Dependabot
      # still gets a real, green signal on everything else (lint, the rest
      # of the suite, build) rather than a permanently red PR it can never
      # fix by itself.
      - if: github.actor != 'dependabot[bot]'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - if: github.actor != 'dependabot[bot]'
        uses: google-github-actions/setup-gcloud@v2

      # Cached by content hash - the model doesn't change on every commit,
      # no reason to re-download 87MB on every single push/PR.
      - if: github.actor != 'dependabot[bot]'
        uses: actions/cache@v4
        id: model-cache
        with:
          path: models/commfor-384.onnx
          key: commfor-384-v1

      - if: github.actor != 'dependabot[bot]' && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          gcloud storage cp gs://${{ secrets.GCP_PROJECT_ID }}-models/commfor-384/v1.onnx models/commfor-384.onnx

      - run: npm test

      - run: npm run build

  deploy:
    needs: ci
    # Only after a real merge to main - never for a pull_request event, so
    # opening/updating a PR gets CI feedback without ever touching prod.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Baked into the image at build time (Dockerfile COPYs models/), not
      # fetched by the container at runtime - see infra/models.tf.
      - name: Fetch AI-detection model
        run: |
          mkdir -p models
          gcloud storage cp gs://${{ secrets.GCP_PROJECT_ID }}-models/commfor-384/v1.onnx models/commfor-384.onnx

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}
        run: |
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          # FIREBASE_PROJECT_ID and HIVE_API_KEY are read at runtime
          # (server-only env vars, no NEXT_PUBLIC_ prefix) - never baked
          # into the image as build args, unlike Kaleido's public Firebase
          # web config. HIVE_API_KEY is a real secret and must stay one.
          env_vars: |
            FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            HIVE_API_KEY=${{ secrets.HIVE_API_KEY }}
          # Public access (roles/run.invoker for allUsers) is managed once,
          # declaratively, in infra/cloud_run.tf - not via an
          # --allow-unauthenticated flag here, since that requires
          # run.services.setIamPolicy on every deploy, a permission
          # deliberately excluded from this account's roles/run.developer
          # role (deploy != grant access). See infra/wif.tf.
          #
          # No --min-instances: tried min-instances=1 to avoid scale-to-zero
          # cold starts, but at ~$60/month (1 vCPU + 512MiB kept allocated
          # 24/7, computed against real Cloud Run pricing - not the "a few
          # dollars" this comment used to claim) it doesn't pay for itself
          # yet. The two things that made it worth it - Core Web Vitals for
          # SEO ranking, and real visitors noticing the latency - both
          # require the SEO push and real traffic that don't exist yet
          # (SEO is explicitly paused pending the Hive ToS situation).
          # Revisit when the SEO push actually resumes.
          #
          # --service-account: without this, Cloud Run silently runs the
          # container as the default compute SA, which GCP auto-grants
          # roles/editor - found by checking, not assuming, and it's a real
          # gap for an app that parses untrusted uploaded images through a
          # native addon. pixeltruth-runtime (infra/runtime.tf) has only
          # roles/datastore.user, the actual ceiling of what the app needs.
          #
          # --memory/--cpu: measured, not guessed - the Node process alone
          # (model loaded, one inference done) uses ~400MB RSS, dangerously
          # close to Cloud Run's unset 512Mi default with zero headroom for
          # Next.js itself or concurrent requests. Unlike min-instances,
          # this cost is request-duration-only (not idle/always-on), so
          # sizing generously here doesn't carry the same cost tradeoff
          # that min-instances did.
          flags: >-
            --service-account=pixeltruth-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --memory=2Gi
            --cpu=2

      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
