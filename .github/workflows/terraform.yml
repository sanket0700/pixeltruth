name: Terraform

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]

defaults:
  run:
    working-directory: infra

permissions:
  contents: read
  # Keyless auth via Workload Identity Federation, same as deploy.yml - but
  # note the WIF setup itself (and everything in wif.tf) was necessarily
  # created by a local `terraform apply` the first time, since no CI
  # identity can exist before the trust relationship it depends on does.
  # See infra/README.md.
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    # Dependabot-triggered runs don't get repository secrets at all (a
    # GitHub platform default, confirmed by a real failed run here, not
    # assumed - the same restriction deploy.yml's ci job hit). Unlike that
    # job, there's no way to make terraform plan itself work without real
    # GCP credentials - it has to read actual remote state - so the whole
    # job is skipped rather than guaranteed-failing on every Dependabot PR
    # that touches infra/**. Those PRs then show no plan check at all (same
    # as any PR whose changes don't hit this workflow's path filter), and
    # get reviewed manually before merge - which a Terraform provider
    # version bump warrants anyway.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_INFRA_SERVICE_ACCOUNT }}

      - run: terraform init

      - run: terraform fmt -check

      - run: terraform validate

      - id: plan
        run: terraform plan -no-color
        continue-on-error: true

      # Surface the plan on the PR itself rather than making reviewers dig
      # through Actions logs for something this consequential (real,
      # billed cloud resources).
      - if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${process.env.PLAN}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    needs: plan
    # Only on a real merge to main - a PR's plan job runs the same commands
    # read-only (terraform plan doesn't change anything), apply never does.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_INFRA_SERVICE_ACCOUNT }}

      - run: terraform init

      - run: terraform apply -auto-approve
